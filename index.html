<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timr">
<meta name="theme-color" content="#060b18">
<meta name="mobile-web-app-capable" content="yes">
<title>Timr — Timer com Presets</title>
<style>
  :root{
    --bg:#060b18;
    --card:#0e1a30;
    --card-hover:#14233f;
    --border:#1e3357;
    --text:#eaf2ff;
    --muted:#7d93b8;
    --accent:#3b82f6;
    --accent2:#38bdf8;
    --grad:linear-gradient(135deg,#1d4ed8,#0ea5e9);
    --danger:#f87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html, body {
    height: 100%;
    width: 100%;
    background: var(--bg);
    /* evita a barra branca no iOS */
    background-color: var(--bg);
    overscroll-behavior: none;
  }
  body{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#0e2247 0%,var(--bg) 60%) fixed;
    color:var(--text);
    min-height: 100%;
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    /* padding seguro para notch / Dynamic Island / home indicator */
    padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left));
    -webkit-user-select: none;
    user-select: none;
  }
  .app{
    width:100%;max-width:420px;
    display:flex;flex-direction:column;gap:28px;
    animation:fadeUp .6s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  header{text-align:center;}
  header h1{
    font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);font-size:13px;margin-top:4px;}

  /* ---- Timer ring ---- */
  .ring-wrap{position:relative;width:min(72vw,300px);margin:0 auto;aspect-ratio:1;}
  svg.ring{width:100%;height:100%;}
  .ring-bg{fill:none;stroke:#142540;stroke-width:10;}
  .ring-fg{fill:none;stroke:url(#gradStroke);stroke-width:10;stroke-linecap:round;
    transition:stroke-dashoffset .3s linear;}
  .ring-dot{
    position:absolute;top:0;left:50%;width:18px;height:18px;border-radius:50%;
    background:#fff;border:4px solid var(--bg);
    transform:translate(-50%,-50%);
    box-shadow:0 0 16px rgba(56,189,248,.9);
  }
  .time-display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .time-display .time{font-size:clamp(48px,15vw,64px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;}
  .time-display .label{color:var(--muted);font-size:14px;}

  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{border:none;cursor:pointer;font-size:15px;font-weight:600;
    padding:14px 28px;border-radius:999px;color:#fff;transition:transform .12s ease,opacity .2s;}
  .btn:active{transform:scale(.95);}
  .btn.primary{background:var(--grad);box-shadow:0 8px 24px rgba(29,78,216,.4);}
  .btn.ghost{background:#142540;color:var(--text);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.wake{font-size:12px;padding:10px 16px;background:#0a1424;border:1px solid var(--border);}

  .presets h2{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;text-align:center;}
  .preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .preset{
    position:relative;
    background:var(--card);border:1px solid transparent;border-radius:18px;
    padding:16px 10px;text-align:center;cursor:pointer;
    transition:all .2s ease;color:var(--text);
  }
  .preset:hover{background:var(--card-hover);transform:translateY(-3px);border-color:var(--border);}
  .preset.active{border-color:var(--accent);background:var(--card-hover);
    box-shadow:0 0 0 1px var(--accent),0 8px 20px rgba(59,130,246,.25);}
  .preset .icon{font-size:24px;margin-bottom:8px;display:block;}
  .preset .name{font-size:13px;font-weight:600;display:block;}
  .preset .dur{font-size:12px;color:var(--muted);display:block;margin-top:2px;}
  .preset .del{
    position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
    border:none;background:rgba(248,113,113,.15);color:var(--danger);
    font-size:11px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s;
  }
  .preset:hover .del{opacity:1;}
  .preset .del:hover{background:var(--danger);color:#fff;}
  .preset.add{
    border:1.5px dashed var(--border);background:transparent;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:13px;font-weight:600;
  }
  .preset.add:hover{border-color:var(--accent);color:var(--accent2);}

  .done-flash{animation:flash .6s ease;}
  @keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.8) saturate(1.5)}}

  .hint{
    text-align:center;font-size:11px;color:var(--muted);line-height:1.4;
    padding:0 8px;
  }
  .hint strong{color:var(--accent2);}

  /* ---- Modal ---- */
  .modal-bg{
    position:fixed;inset:0;background:rgba(3,7,17,.75);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:10;
    padding: max(20px, var(--safe-top)) max(20px, var(--safe-right)) max(20px, var(--safe-bottom)) max(20px, var(--safe-left));
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card);border:1px solid var(--border);border-radius:22px;
    width:100%;max-width:360px;padding:24px;
    animation:fadeUp .3s ease both;
  }
  .modal h3{font-size:16px;margin-bottom:16px;}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:1px;}
  .modal input[type=text]{
    width:100%;background:#0a1424;border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;color:var(--text);font-size:15px;outline:none;
  }
  .modal input[type=text]:focus{border-color:var(--accent);}
  .dur-row{display:flex;gap:10px;}
  .dur-row input{
    flex:1;background:#0a1424;border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;color:var(--text);font-size:15px;outline:none;text-align:center;
  }
  .emoji-row{display:flex;gap:8px;flex-wrap:wrap;}
  .emoji-opt{
    font-size:22px;background:#0a1424;border:1.5px solid var(--border);border-radius:12px;
    width:44px;height:44px;cursor:pointer;transition:all .15s;
  }
  .emoji-opt.sel{border-color:var(--accent);background:#12294d;transform:scale(1.1);}
  .modal-btns{display:flex;gap:10px;margin-top:20px;}
  .modal-btns .btn{flex:1;padding:12px;}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Timr</h1>
    <p>escolhe um preset e carrega em iniciar</p>
  </header>

  <div class="ring-wrap" id="ringWrap">
    <svg class="ring" viewBox="0 0 260 260" style="transform:rotate(-90deg)">
      <defs>
        <linearGradient id="gradStroke" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1d4ed8"/>
          <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="130" cy="130" r="120"/>
      <circle class="ring-fg" id="ringFg" cx="130" cy="130" r="120"/>
    </svg>
    <div class="ring-dot" id="ringDot"></div>
    <div class="time-display">
      <div class="time" id="timeText">25:00</div>
      <div class="label" id="labelText">Pomodoro</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn ghost" id="resetBtn">Reiniciar</button>
    <button class="btn primary" id="startBtn">Iniciar</button>
  </div>

  <section class="presets">
    <h2>Timers pré-definidos</h2>
    <div class="preset-grid" id="presetGrid"></div>
  </section>

  <p class="hint" id="hint">
    <strong>No iPhone:</strong> Safari → Partilhar → “Adicionar ao ecrã principal”.<br>
    Depois abre a partir do ícone (modo app, ecrã completo).<br>
    O timer continua a contar mesmo com o ecrã bloqueado.
  </p>
</div>

<!-- Modal novo preset -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>➕ Novo timer</h3>
    <label for="pName">Nome</label>
    <input type="text" id="pName" placeholder="Ex.: Massa, Tabata..." maxlength="18">
    <label>Duração</label>
    <div class="dur-row">
      <input type="number" id="pMin" min="0" max="999" value="5" placeholder="min">
      <input type="number" id="pSec" min="0" max="59" value="0" placeholder="seg">
    </div>
    <label>Ícone</label>
    <div class="emoji-row" id="emojiRow"></div>
    <div class="modal-btns">
      <button class="btn ghost" id="cancelAdd">Cancelar</button>
      <button class="btn primary" id="saveAdd">Guardar</button>
    </div>
  </div>
</div>

<script>
const R = 120, CIRC = 2 * Math.PI * R;
const ringFg = document.getElementById('ringFg');
ringFg.style.strokeDasharray = CIRC;
ringFg.style.strokeDashoffset = 0;

const DEFAULTS = [
  {icon:'🍅', name:'Pomodoro',   dur:25*60},
  {icon:'☕', name:'Pausa café', dur:5*60},
  {icon:'🌿', name:'Pausa longa',dur:15*60},
  {icon:'🍵', name:'Chá',        dur:3*60},
  {icon:'🥚', name:'Ovo',        dur:7*60},
  {icon:'🔥', name:'HIIT',       dur:30},
  {icon:'🧘', name:'Meditação',  dur:10*60},
  {icon:'📖', name:'Leitura',    dur:20*60},
  {icon:'⏱️', name:'Quick 1min', dur:60},
];
const EMOJIS = ['🍳','🏋️','⚽','🎮','🚿','🧪','🎂','🍝','💤','🏃','🎯','🔋'];

let presets = load();
let selIdx = 0, selectedEmoji = EMOJIS[0];
let total = presets[0].dur;
let remaining = total;
let running = false;
let endTime = null;          // timestamp de fim (ms) — chave para funcionar com ecrã bloqueado
let rafId = null;
let audioCtx = null;
let wakeLock = null;

const timeText  = document.getElementById('timeText');
const labelText = document.getElementById('labelText');
const startBtn  = document.getElementById('startBtn');
const resetBtn  = document.getElementById('resetBtn');
const ringDot   = document.getElementById('ringDot');
const app       = document.getElementById('app');
const grid      = document.getElementById('presetGrid');
const modalBg   = document.getElementById('modalBg');

function load(){
  try{
    const s = localStorage.getItem('timr-presets');
    if(s){ const p = JSON.parse(s); if(Array.isArray(p) && p.length) return p; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ localStorage.setItem('timr-presets', JSON.stringify(presets)); }

function fmt(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), ss = s%60;
  return String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}

function render(){
  timeText.textContent = fmt(remaining);
  const frac = total > 0 ? remaining/total : 0;
  ringFg.style.strokeDashoffset = CIRC * (1 - frac);
  const angle = -Math.PI/2 + 2*Math.PI*(1-frac);
  const wrap = document.getElementById('ringWrap');
  const wr = wrap.offsetWidth/2;
  ringDot.style.left = (wr + (wr-9) * Math.cos(angle)) + 'px';
  ringDot.style.top  = (wr + (wr-9) * Math.sin(angle)) + 'px';
  document.title = (running ? fmt(remaining) + ' · ' : '') + 'Timr';
}

function beep(freq=880, dur=0.18, when=0){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function finishSound(){
  beep(880,.15,0); beep(1108,.15,.2); beep(1318,.35,.4);
}

function finish(){
  remaining = 0;
  running = false;
  endTime = null;
  startBtn.textContent = 'Iniciar';
  finishSound();
  app.classList.remove('done-flash'); void app.offsetWidth;
  app.classList.add('done-flash');
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('⏰ Timr', {body:'Tempo esgotado: ' + labelText.textContent, tag:'timr-done'}); }catch(e){}
  }
  releaseWakeLock();
  render();
}

function tick(){
  if(!running || endTime === null) return;
  remaining = Math.max(0, (endTime - Date.now()) / 1000);
  if(remaining <= 0){
    finish();
    return;
  }
  render();
  rafId = requestAnimationFrame(tick);
}

async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch(e){ /* utilizador recusou ou bateria baixa */ }
}

function releaseWakeLock(){
  if(wakeLock){
    try{ wakeLock.release(); }catch(e){}
    wakeLock = null;
  }
}

function startPause(){
  if(remaining <= 0) remaining = total;
  running = !running;
  startBtn.textContent = running ? 'Pausar' : 'Continuar';

  if(running){
    endTime = Date.now() + remaining * 1000;
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
    requestWakeLock();
    rafId = requestAnimationFrame(tick);
  } else {
    // pausar: guarda o remaining atual e cancela o endTime
    if(endTime) remaining = Math.max(0, (endTime - Date.now()) / 1000);
    endTime = null;
    cancelAnimationFrame(rafId);
    releaseWakeLock();
  }
  render();
}

function reset(){
  running = false;
  cancelAnimationFrame(rafId);
  endTime = null;
  remaining = total;
  startBtn.textContent = 'Iniciar';
  releaseWakeLock();
  render();
}

function selectPreset(i){
  selIdx = Math.max(0, Math.min(i, presets.length-1));
  const p = presets[selIdx];
  total = p.dur; remaining = total;
  labelText.textContent = p.name;
  reset();
  document.querySelectorAll('.preset:not(.add)').forEach((el,j)=>el.classList.toggle('active', j===selIdx));
}

function renderGrid(){
  grid.innerHTML = '';
  presets.forEach((p,i)=>{
    const b = document.createElement('button');
    b.className = 'preset' + (i===selIdx ? ' active' : '');
    b.innerHTML = `<span class="icon">${p.icon}</span><span class="name">${p.name}</span><span class="dur">${fmt(p.dur)}</span>
      <span class="del" title="Remover">✕</span>`;
    b.onclick = (e)=>{
      if(e.target.classList.contains('del')){
        e.stopPropagation();
        presets.splice(i,1); save();
        if(selIdx >= presets.length) selIdx = Math.max(0, presets.length-1);
        if(!presets.length){ presets = JSON.parse(JSON.stringify(DEFAULTS)); save(); }
        selectPreset(Math.min(selIdx, presets.length-1));
        renderGrid();
        return;
      }
      selectPreset(i);
      renderGrid();
    };
    grid.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'preset add';
  add.innerHTML = '<span style="font-size:24px">＋</span><span>Novo timer</span>';
  add.onclick = openModal;
  grid.appendChild(add);
}

/* ---- Modal ---- */
const emojiRow = document.getElementById('emojiRow');
EMOJIS.forEach((em,i)=>{
  const b = document.createElement('button');
  b.className = 'emoji-opt' + (i===0 ? ' sel' : '');
  b.textContent = em;
  b.onclick = ()=>{
    selectedEmoji = em;
    document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  };
  emojiRow.appendChild(b);
});

function openModal(){
  modalBg.classList.add('open');
  document.getElementById('pName').focus();
}
function closeModal(){ modalBg.classList.remove('open'); }

document.getElementById('cancelAdd').onclick = closeModal;
modalBg.onclick = e=>{ if(e.target===modalBg) closeModal(); };
document.getElementById('saveAdd').onclick = ()=>{
  const name = document.getElementById('pName').value.trim() || 'Timer';
  const m = Math.max(0, parseInt(document.getElementById('pMin').value)||0);
  const s = Math.max(0, Math.min(59, parseInt(document.getElementById('pSec').value)||0));
  const dur = m*60 + s;
  if(dur <= 0) return;
  presets.push({icon:selectedEmoji, name, dur});
  save();
  document.getElementById('pName').value = '';
  closeModal();
  selectPreset(presets.length-1);
  renderGrid();
};

/* ---- Continua a contar mesmo com ecrã bloqueado / app em background ---- */
function syncFromEndTime(){
  if(!running || endTime === null) return;
  remaining = Math.max(0, (endTime - Date.now()) / 1000);
  if(remaining <= 0){
    finish();
  } else {
    render();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    syncFromEndTime();
    if(running) requestWakeLock();
  } else {
    // quando fica escondido (bloqueio ou troca de app) libertamos o wake lock
    // o endTime continua a guardar o momento de fim
    releaseWakeLock();
  }
});

// iOS por vezes usa pagehide/pageshow
window.addEventListener('pagehide', ()=> releaseWakeLock());
window.addEventListener('pageshow', (e)=>{
  if(e.persisted) syncFromEndTime();
});

// quando o utilizador volta do lock screen
window.addEventListener('focus', syncFromEndTime);

startBtn.onclick = startPause;
resetBtn.onclick = reset;
window.addEventListener('resize', render);

// impede o pull-to-refresh a estragar a experiência
document.body.addEventListener('touchmove', e=>{
  if(e.target.closest('.modal') || e.target.closest('.preset-grid')) return;
  // deixa scroll normal no modal/grid se necessário
}, {passive:true});

renderGrid();
render();
</script>
</body>
</html>
